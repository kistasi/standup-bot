name: standup

on:
  schedule:
    - cron: "0 5 * * 1-5" # 05:00 UTC = 07:00 Budapest (CEST); 06:00 in winter (CET). Cron is UTC, no DST.
  workflow_dispatch: {} # manual trigger for testing

jobs:
  standup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: go run .
        env:
          # Secrets
          GH_PAT: ${{ secrets.GH_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }} # optional: Google credentials JSON, shared by calendar and Drive
          # Non-secret config
          GH_ORG: ${{ vars.GH_ORG }}
          AUTHOR_EMAILS: ${{ vars.AUTHOR_EMAILS }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }} # optional: switches the calendar on, needs GOOGLE_CREDENTIALS_JSON
          GOOGLE_DRIVE_FOLDER: ${{ vars.GOOGLE_DRIVE_FOLDER }} # optional: switches the Drive backup on, needs GOOGLE_CREDENTIALS_JSON (with the drive.file scope)
